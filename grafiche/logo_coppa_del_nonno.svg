<svg width="100%" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Logo Coppa del Nonno</title>
  <desc>Logo vintage da corsa con bandiera a scacchi, sagoma Mazda MX-5 NB/FL e testo Coppa del Nonno</desc>

  <defs>
    <pattern id="checker" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="8" fill="#ffffff"/>
      <rect x="8" y="0" width="8" height="8" fill="#1a1a1a"/>
      <rect x="0" y="8" width="8" height="8" fill="#1a1a1a"/>
      <rect x="8" y="8" width="8" height="8" fill="#ffffff"/>
    </pattern>
    <linearGradient id="carFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#cc0000" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#cc0000" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#cc0000" stop-opacity="0.38"/>
      <stop offset="80%"  stop-color="#cc0000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cc0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="carFadeGray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#aaaaaa" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#aaaaaa" stop-opacity="0.20"/>
      <stop offset="50%"  stop-color="#aaaaaa" stop-opacity="0.40"/>
      <stop offset="80%"  stop-color="#aaaaaa" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#aaaaaa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="carFadeGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6699cc" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#6699cc" stop-opacity="0.10"/>
      <stop offset="50%"  stop-color="#6699cc" stop-opacity="0.22"/>
      <stop offset="80%"  stop-color="#6699cc" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6699cc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="20" y="10" width="640" height="200" rx="6" fill="#1a1a1a" stroke="#cc0000" stroke-width="2.5"/>
  <rect x="28" y="18" width="624" height="184" rx="4" fill="none" stroke="#cc0000" stroke-width="0.8"/>

  <!-- Ruota posteriore -->
  <circle cx="212" cy="161" r="24" fill="none" stroke="url(#carFadeGray)" stroke-width="5.5"/>
  <circle cx="212" cy="161" r="9"  fill="url(#carFade)"/>
  <line x1="212" y1="137" x2="212" y2="185" stroke="url(#carFadeGray)" stroke-width="1.2"/>
  <line x1="188" y1="161" x2="236" y2="161" stroke="url(#carFadeGray)" stroke-width="1.2"/>
  <line x1="195" y1="144" x2="229" y2="178" stroke="url(#carFadeGray)" stroke-width="1.2"/>
  <line x1="229" y1="144" x2="195" y2="178" stroke="url(#carFadeGray)" stroke-width="1.2"/>

  <!-- Ruota anteriore -->
  <circle cx="468" cy="161" r="24" fill="none" stroke="url(#carFadeGray)" stroke-width="5.5"/>
  <circle cx="468" cy="161" r="9"  fill="url(#carFade)"/>
  <line x1="468" y1="137" x2="468" y2="185" stroke="url(#carFadeGray)" stroke-width="1.2"/>
  <line x1="444" y1="161" x2="492" y2="161" stroke="url(#carFadeGray)" stroke-width="1.2"/>
  <line x1="451" y1="144" x2="485" y2="178" stroke="url(#carFadeGray)" stroke-width="1.2"/>
  <line x1="485" y1="144" x2="451" y2="178" stroke="url(#carFadeGray)" stroke-width="1.2"/>

  <!-- Sottoscocca -->
  <rect x="136" y="155" width="408" height="7" rx="2" fill="url(#carFade)"/>

  <!-- Paraurti posteriore + spoiler -->
  <path d="M138,155 C136,148 140,142 148,140 L158,138 L158,155 Z" fill="url(#carFade)" stroke="none"/>
  <path d="M140,140 L158,137 L158,135 L136,138 Z" fill="url(#carFadeGray)" stroke="none"/>

  <!-- Parafango posteriore -->
  <path d="M158,138 C168,132 188,128 212,128 C228,128 238,132 244,136 L244,155 L158,155 Z" fill="url(#carFade)" stroke="none"/>

  <!-- Corpo centrale -->
  <rect x="244" y="136" width="172" height="19" fill="url(#carFade)"/>

  <!-- Parafango anteriore -->
  <path d="M416,136 C428,132 450,128 468,128 C490,128 508,134 516,140 L520,155 L416,155 Z" fill="url(#carFade)" stroke="none"/>

  <!-- Paraurti anteriore -->
  <path d="M520,155 L522,148 C524,140 520,134 510,130 L500,128 L516,140 Z" fill="url(#carFade)" stroke="none"/>

  <!-- Cofano NB/FL -->
  <path d="M416,136 C428,134 450,124 480,118 C498,114 512,116 520,120 L520,128 C510,124 492,122 476,126 C452,130 428,138 416,138 Z" fill="url(#carFade)" stroke="none"/>

  <!-- Nervatura centrale cofano -->
  <path d="M420,135 C445,127 472,121 508,118" fill="none" stroke="url(#carFadeGray)" stroke-width="1.2"/>

  <!-- Faro anteriore fisso NB/FL -->
  <path d="M508,118 L522,120 L520,128 L506,126 Z" fill="url(#carFadeGlass)" stroke="url(#carFadeGray)" stroke-width="0.8"/>
  <path d="M510,127 L522,128 L522,132 L510,131 Z" fill="url(#carFade)" stroke="none" opacity="0.5"/>

  <!-- Specchietto -->
  <path d="M418,118 L408,122 L410,127 L420,124 Z" fill="url(#carFadeGray)" opacity="0.6"/>

  <!-- Tetto -->
  <path d="M260,137 C265,128 275,112 292,104 C310,96 330,92 340,92 C350,92 368,95 385,103 C400,111 410,124 416,136 Z" fill="url(#carFade)" stroke="none"/>

  <!-- Parabrezza -->
  <path d="M290,104 C310,93 330,89 340,89 C350,89 368,92 388,103 L385,108 C368,98 350,95 340,95 C330,95 312,98 293,108 Z" fill="url(#carFadeGlass)" stroke="none"/>

  <!-- Lunotto posteriore -->
  <path d="M264,132 C268,122 272,114 280,108 L290,104 L293,108 C284,112 278,120 274,130 Z" fill="url(#carFadeGlass)" stroke="none"/>

  <!-- Linea fiancata -->
  <path d="M165,144 Q280,139 340,139 Q400,139 515,144" fill="none" stroke="url(#carFadeGray)" stroke-width="1.4"/>

  <!-- Maniglia porta -->
  <rect x="315" y="128" width="26" height="5" rx="2" fill="url(#carFadeGray)" opacity="0.5"/>

  <!-- Presa d'aria laterale -->
  <path d="M350,141 L370,140 L370,143 L350,144 Z" fill="url(#carFade)" opacity="0.5"/>

  <!-- Bandiere a scacchi -->
  <rect x="38" y="28" width="96" height="64" rx="2" fill="url(#checker)"/>
  <rect x="38" y="28" width="96" height="64" rx="2" fill="none" stroke="#999" stroke-width="0.8"/>
  <rect x="546" y="28" width="96" height="64" rx="2" fill="url(#checker)"/>
  <rect x="546" y="28" width="96" height="64" rx="2" fill="none" stroke="#999" stroke-width="0.8"/>

  <!-- Linee decorative -->
  <line x1="148" y1="38" x2="244" y2="38" stroke="#cc0000" stroke-width="1"/>
  <line x1="148" y1="43" x2="244" y2="43" stroke="#cc0000" stroke-width="0.4"/>
  <line x1="436" y1="38" x2="532" y2="38" stroke="#cc0000" stroke-width="1"/>
  <line x1="436" y1="43" x2="532" y2="43" stroke="#cc0000" stroke-width="0.4"/>

  <text x="340" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" letter-spacing="10" fill="#cccccc">COPPA DEL</text>
  <text x="340" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="8" fill="#cc0000">NONNO</text>

  <line x1="148" y1="82" x2="244" y2="82" stroke="#cc0000" stroke-width="0.4"/>
  <line x1="148" y1="87" x2="244" y2="87" stroke="#cc0000" stroke-width="1"/>
  <line x1="436" y1="82" x2="532" y2="82" stroke="#cc0000" stroke-width="0.4"/>
  <line x1="436" y1="87" x2="532" y2="87" stroke="#cc0000" stroke-width="1"/>

  <text x="340" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="6" fill="#888888">CLASSIFICHE UFFICIALI</text>

  <line x1="160" y1="172" x2="520" y2="172" stroke="#cc0000" stroke-width="0.8"/>
  <polygon points="152,172 160,168 168,172 160,176" fill="#cc0000"/>
  <polygon points="512,172 520,168 528,172 520,176" fill="#cc0000"/>

  <text x="340" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="4" fill="#555555">EST. 2025</text>

</svg>
